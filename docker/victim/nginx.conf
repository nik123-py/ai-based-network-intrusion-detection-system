# Victim web server for the Netra lab (stock nginx:1.27-alpine with this config mounted).
#   /        a static page (normal traffic target)
#   /admin/  HTTP basic authentication (login target for the brute-force demo)
# The account in htpasswd exists only inside this isolated lab.
server {
    listen 80;
    server_name victim;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /admin/ {
        auth_basic "Netra lab admin";
        auth_basic_user_file /etc/nginx/htpasswd;
        try_files $uri $uri/ /index.html;
    }
}
